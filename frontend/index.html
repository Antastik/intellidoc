<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntelliDoc — Ask your documents</title>
<style>
  :root{--bg:#0f1419;--panel:#1a212b;--border:#2a3441;--text:#e6edf3;--dim:#9aa7b4;--accent:#4cc2ff;--good:#7df0a3;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  header h1{font-size:18px;margin:0;}
  header .badge{font-size:11px;color:var(--dim);border:1px solid var(--border);padding:3px 8px;border-radius:20px;}
  main{max-width:880px;margin:0 auto;padding:24px;display:grid;gap:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:0 0 12px;}
  input[type=file],input[type=text]{width:100%;background:#0f1419;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:14px;}
  .row{display:flex;gap:10px;}
  button{background:var(--accent);color:#06222f;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .docs{display:flex;flex-wrap:wrap;gap:8px;}
  .doc{font-size:12px;background:#0f1419;border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--dim);}
  #answer{white-space:pre-wrap;line-height:1.55;}
  .cite{border-left:2px solid var(--accent);padding:8px 12px;margin:8px 0;background:#0f1419;border-radius:0 6px 6px 0;}
  .cite .meta{font-size:12px;color:var(--accent);margin-bottom:4px;}
  .cite .snip{font-size:13px;color:var(--dim);}
  .muted{color:var(--dim);font-size:13px;}
</style>
</head>
<body>
<header>
  <h1>IntelliDoc</h1>
  <span class="badge" id="status">connecting…</span>
</header>
<main>
  <div class="card">
    <h2>1 · Upload PDFs</h2>
    <div class="row">
      <input type="file" id="files" accept="application/pdf" multiple />
      <button id="uploadBtn">Upload</button>
    </div>
    <p class="muted" id="uploadMsg"></p>
    <div class="docs" id="docs"></div>
  </div>

  <div class="card">
    <h2>2 · Ask a question</h2>
    <div class="row">
      <input type="text" id="question" placeholder="What does the document say about…?" />
      <button id="askBtn">Ask</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>Answer</h2>
    <div id="answer"></div>
    <h2 style="margin-top:18px;">Sources</h2>
    <div id="citations"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

// --- DOM helpers: everything from the API is untrusted text, never markup. ---
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

// --- Shared response parser. Reads the body once, tolerates JSON, plain text
// and HTML gateway pages, and turns any non-2xx into an Error with a useful
// message (FastAPI `detail` string, validation arrays, or the HTTP status). ---
async function readResponse(r){
  const text = await r.text();
  const ctype = (r.headers && typeof r.headers.get === 'function' && r.headers.get('content-type')) || '';
  const looksHtml = /text\/html/i.test(ctype) || /^\s*</.test(text);
  let data = null;
  if(text && !looksHtml){ try{ data = JSON.parse(text); }catch(_){ data = null; } }
  if(r.ok){
    if(data === null) throw new Error(`Unexpected non-JSON response from server (HTTP ${r.status}).`);
    return data;
  }
  throw new Error(errorMessage(r, data, text, looksHtml));
}

function errorMessage(r, data, text, looksHtml){
  const status = `HTTP ${r.status}${r.statusText ? ' ' + r.statusText : ''}`;
  let detail = data && typeof data === 'object' ? data.detail : null;
  if(Array.isArray(detail)){
    detail = detail.map(d => {
      if(!d || typeof d !== 'object') return String(d);
      const loc = Array.isArray(d.loc) ? d.loc.filter(p => p !== 'body').join('.') : '';
      return [loc, d.msg].filter(Boolean).join(': ') || JSON.stringify(d);
    }).join('; ');
  }else if(detail && typeof detail === 'object'){
    detail = JSON.stringify(detail);
  }
  if(typeof detail === 'string' && detail.trim()) return `${detail.trim()} (${status})`;
  if(data === null && text && !looksHtml) return `${text.trim().slice(0, 200)} (${status})`;
  return `${status} — the server returned an unexpected response.`;
}

async function getJSON(url){ return readResponse(await fetch(url)); }

function renderDocs(docs){
  const box = $('docs');
  clear(box);
  if(!Array.isArray(docs)) return;
  for(const d of docs){
    box.appendChild(el('span', 'doc', `${d.source} · ${d.pages}p · ${d.chunks} chunks`));
  }
}

function renderCitations(citations){
  const box = $('citations');
  clear(box);
  if(!Array.isArray(citations) || !citations.length){
    box.appendChild(el('p', 'muted', 'No sources.'));
    return;
  }
  citations.forEach((c, i) => {
    const cite = el('div', 'cite');
    cite.appendChild(el('div', 'meta', `[${i+1}] ${c.source}${c.page?(' · p.'+c.page):''} · score ${c.score}`));
    cite.appendChild(el('div', 'snip', c.snippet));
    box.appendChild(cite);
  });
}

async function refresh(){
  try{
    const h = await getJSON('/api/health');
    $('status').textContent = `${h.llm_provider} · ${h.documents} docs · ${h.chunks} chunks`;
    renderDocs(await getJSON('/api/documents'));
  }catch(e){ $('status').textContent = 'offline'; }
}

let uploading = false;
$('uploadBtn').onclick = async () => {
  if(uploading) return;
  const fs = $('files').files;
  if(!fs || !fs.length){ $('uploadMsg').textContent = 'Pick at least one PDF.'; return; }
  const fd = new FormData();
  for(const f of fs) fd.append('files', f);
  uploading = true;
  $('uploadBtn').disabled = true; $('uploadMsg').textContent = 'Uploading & indexing…';
  try{
    const r = await fetch('/api/upload', {method:'POST', body:fd});
    const data = await readResponse(r);
    const n = data && Array.isArray(data.documents) ? data.documents.length : 0;
    $('uploadMsg').textContent = `Indexed ${n} document(s).`;
  }catch(e){ $('uploadMsg').textContent = 'Error: ' + ((e && e.message) || String(e)); }
  finally{
    uploading = false;
    $('uploadBtn').disabled = false;
    refresh(); // reflect whatever the backend actually committed, success or not
  }
};

let asking = false;
$('askBtn').onclick = async () => {
  if(asking) return;
  const q = $('question').value.trim();
  if(!q) return;
  asking = true;
  $('askBtn').disabled = true;
  $('resultCard').style.display = 'block';
  $('answer').textContent = 'Thinking…'; clear($('citations'));
  try{
    const r = await fetch('/api/query', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q})});
    const data = await readResponse(r);
    if(!data || typeof data.answer !== 'string' || !Array.isArray(data.citations)){
      throw new Error('Malformed answer from server.');
    }
    $('answer').textContent = data.answer;
    renderCitations(data.citations);
  }catch(e){
    $('answer').textContent = 'Error: ' + ((e && e.message) || String(e));
    clear($('citations'));
  }finally{
    asking = false;
    $('askBtn').disabled = false;
  }
};

$('question').addEventListener('keydown', e=>{
  if(e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();
  if(!asking && !$('askBtn').disabled) $('askBtn').click();
});
refresh();
</script>
</body>
</html>
