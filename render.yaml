# Render blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then in Render → New → Blueprint → pick this repo.
# Set GEMINI_API_KEY in the dashboard (it is marked sync:false so it is never
# stored in git).
services:
  - type: web
    name: intellidoc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_LLM_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      # Paste your key in the Render dashboard — never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
